role: Professor of Physics
bio: |
  Justin Bergfield investigates the quantum mechanical aspects of the flow of heat, charge, spin,
  and information at the nanoscale, with an emphasis on molecule-based systems. His research bridges
  condensed matter physics, chemistry, and electrical engineering, and focuses on how quantum
  coherence and interference can be read, lost, erased, and exploited in nanoscale energy-conversion
  devices.

